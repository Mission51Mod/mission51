[package]
name = "foxbuild"
description = "Incremental, parallel, memory-budgeted map build orchestrator (ninja-style, traced I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "foxbuild"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = { version = "1.8", features = ["std"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("internal-game-data", "internal-pipeline", "internal-proofs", "proof-compat", "transitional"))'] }
