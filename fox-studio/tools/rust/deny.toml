# PLAN 8.4: no local port/vendor exceptions. Source audit enforces the rule
# that cargo-deny cannot infer from permissive SPDX metadata alone.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "BSL-1.0", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
